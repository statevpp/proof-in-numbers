name: Proof in Numbers — Daily Short

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily — adjust to your preferred posting time
  workflow_dispatch: {}     # lets you click "Run workflow" manually for testing

# Prevents two overlapping runs of this workflow (e.g. a late scheduled run
# colliding with a watchdog- or human-triggered workflow_dispatch a minute
# or two apart) from both missing each other's actions/cache write and
# uploading a duplicate video. Without this, the existing per-pillar cache
# + upload marker (see the "Cache today's..." and "Publish to
# YouTube" steps below) only closes the gap when the two runs are far
# enough apart for the first to finish and its cache to be saved before the
# second starts — true so far by luck of timing, not by guarantee. This
# queues a second run instead of letting it start in parallel;
# cancel-in-progress stays false so a run already publishing videos is
# never killed mid-upload.
concurrency:
  group: daily-short-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Four videos a day — one per content pillar (see 00_Project_Overview.md
    # and fetch_stat.py's module docstring for the full 2026-09-27
    # ESTA.QUEST strategy update: global_viral, global_data_story,
    # real_estate_global, real_estate_sofia). Each matrix entry is its own
    # fully isolated GitHub Actions runner, so the four videos never share a
    # filesystem or step outputs with each other — only the cache key below
    # needs to tell them apart. (Before 2026-09-27 this was a 2-pillar x
    # 2-slot matrix — "slot" existed only to keep two same-pillar videos
    # from picking the same country on the same day. With 4 distinct
    # pillars, one video each, that collision can't happen any more, so
    # "slot" and the SLOT env var are gone entirely — see fetch_stat.py and
    # render_chart.py.)
    # fail-fast: false so one pillar failing (e.g. a bad Gemini call)
    # doesn't cancel the other three videos for the day.
    strategy:
      fail-fast: false
      matrix:
        include:
          - pillar: global_viral
          - pillar: global_data_story
          - pillar: real_estate_global
          - pillar: real_estate_sofia
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set date output
        # Must run BEFORE the cache step below — its key references
        # steps.date.outputs.today, which is empty until this step has run.
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache today's paid API outputs (avoid re-billing on retries)
        # GitHub Actions runners are ephemeral — without this, a failed retry
        # (or a second manual "Run workflow" the same day) regenerates and
        # re-pays for the Gemini calls in fetch_stat.py / generate_script.py /
        # generate_voice.py from scratch, and could even pick a DIFFERENT
        # random stat, making the video inconsistent across attempts. Those
        # three scripts each skip their work if their output file already
        # exists (see the comments in fetch_stat.py's main()).
        #
        # Keyed by UTC date + pillar (no restore-keys fallback) — unlike the
        # sibling Lumaris pipeline, this repo's cached paths (data/, audio/,
        # assets/) are NOT namespaced by date, so falling back to a
        # partial-match key could silently restore a PREVIOUS day's — or a
        # DIFFERENT matrix job's — stat/script/voice files under these exact
        # same paths and the skip-logic above would then wrongly reuse them.
        # The pillar part of the key is what keeps today's four videos from
        # colliding with each other (each pillar is now unique per day — see
        # the strategy note above the matrix); an exact-key cache miss on
        # the first run of a new day is the safe default: it just means
        # everything regenerates fresh, which is what should happen anyway.
        uses: actions/cache@v4
        with:
          path: |
            data
            audio
            assets
          key: daily-short-${{ steps.date.outputs.today }}-${{ matrix.pillar }}

      - name: Install ffmpeg
        # ubuntu-latest does NOT ship ffmpeg by default — confirmed failure
        # mode in the Lumaris pipeline (exit 127, "command not found").
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Make scripts executable
        # Executable bit is lost on git upload if not set explicitly — same
        # trap hit in the Lumaris pipeline (EACCES on assemble script).
        run: chmod +x scripts/assemble_video.sh

      # IMPORTANT: none of the four steps below set `working-directory:
      # scripts`, even though the .py files live in scripts/. All of them
      # write/read paths like "data/...", "audio/...", "assets/..." relative
      # to the process's CWD (NOT relative to the script's own location) —
      # and assemble_video.sh, the artifact upload, and upload_youtube.py all
      # expect those directories at the REPO ROOT. Running with
      # `working-directory: scripts` would make each script create its own
      # "scripts/data/", "scripts/audio/", "scripts/assets/" instead, so the
      # "Assemble video" step below would immediately fail with "Missing
      # required input file(s)". Running `python3 scripts/<file>.py` from
      # the repo root avoids this — Python still finds the sibling
      # `google_genai_helper.py` import fine, because it adds the script's
      # own directory to sys.path automatically regardless of CWD.
      - name: Fetch today's stat
        run: python3 scripts/fetch_stat.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Pins this matrix job to its assigned pillar — see
          # fetch_stat.py's build_candidates() docstring for exactly what
          # this does for each of the 4 pillars.
          FORCE_PILLAR: ${{ matrix.pillar }}

      - name: Generate script (+ automatic fact self-check)
        run: python3 scripts/generate_script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Render chart
        run: python3 scripts/render_chart.py
        # No env needed — render_chart.py now picks both its accent color
        # and its chart template straight from data/today_stat.json's own
        # "pillar" field (TEMPLATE_BY_PILLAR / ACCENT_BY_PILLAR), so all 4
        # of today's videos still look different from each other without a
        # separate SLOT input.

      - name: Generate voice
        run: python3 scripts/generate_voice.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Assemble video + thumbnail (+ automatic technical self-check)
        run: ./scripts/assemble_video.sh .

      - name: Upload video artifact (always, for manual review/backup)
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ steps.date.outputs.today }}-${{ matrix.pillar }}
          path: |
            output/short.mp4
            output/thumbnail.png
            data/script.json
            data/today_stat.json
          retention-days: 14

      - name: Publish to YouTube
        working-directory: .
        run: python3 scripts/upload_youtube.py
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Public uploads, per owner's decision (2026-09-04) — do not
          # revert to "private" without being asked.
          YOUTUBE_PRIVACY_STATUS: "public"

  # Runs once, AFTER all four matrix jobs above (whether they all succeeded
  # or not — if: always() — so a single failed pillar never loses the
  # other three's picks). Deliberately a separate, single job rather than a
  # step inside the matrix: four parallel jobs each committing the same
  # recency_history.json would race each other's git push. One serial job
  # reading all four jobs' uploaded artifacts avoids that entirely. See
  # scripts/record_recency.py and fetch_stat.py's RECENCY_FILE section for
  # the full mechanism (steers future days away from repeating the same
  # country for the same pillar — see 2026-09-07 monitoring notes).
  record-recency:
    needs: build-and-publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set date output
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Download today's per-pillar artifacts
        # continue-on-error: if every matrix job failed before its "Upload
        # video artifact" step, there is nothing to download — that's a bad
        # day for the channel, but must never fail THIS job on top of it.
        # record_recency.py handles a missing/empty directory gracefully.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: daily-short-${{ steps.date.outputs.today }}-*
          path: today-artifacts

      - name: Update recency_history.json
        run: python3 scripts/record_recency.py "${{ steps.date.outputs.today }}" today-artifacts

      - name: Commit and push if changed
        # git diff alone would miss this file the very first time it's
        # created (a brand-new file is untracked, not "modified", so `git
        # diff` sees nothing to compare) — git status catches both cases.
        run: |
          if [ -z "$(git status --porcelain -- recency_history.json)" ]; then
            echo "No recency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recency_history.json
          git commit -m "chore: record ${{ steps.date.outputs.today }} country/pillar picks for recency exclusion"
          # --rebase guards against an unrelated commit having landed on
          # main between this job's checkout and this push (rare, but this
          # job has no other reason to ever fail).
          git pull --rebase origin main
          git push
